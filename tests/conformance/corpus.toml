# Golden HTTP conformance corpus.
#
# Read by tests/conformance/lib/common.py. capture.sh drives every [[cases]]
# entry against the pinned upstream container and writes
# tests/conformance/golden/<name>.http; run.sh replays the same cases and
# diffs the (normalised) response against that golden.
#
# Both capture and replay talk HTTP directly via Python's http.client, not
# through curl. Two places below describe headers using curl's own
# conventions ("User-Agent and Accept explicitly suppressed", "X-Empty-Header;")
# because that is how the source material (frankenphp_test.go, this issue's
# own body) expresses them -- they are transcribed here as the literal wire
# headers those curl invocations would send, not as curl arguments to shell
# out to. Reasons: curl's own default User-Agent embeds curl's version
# (a portability hazard across machines/CI images), and curl has no way to
# put a raw NUL byte in a header value from argv (C strings can't hold one) --
# see the cookies-malformed case below, which hit exactly that wall.
#
# ---------------------------------------------------------------------------
# Normalisation: Content-Length, and why it is restated
# ---------------------------------------------------------------------------
#
# Issue #4 lists Content-Length among the things not to normalise, and
# separately requires the client address to be normalised because "without
# this the goldens are machine-specific". On server-all-vars-ordered those two
# rules contradict each other, so the resolution is recorded here rather than
# left to be rediscovered.
#
# The server computes Content-Length from the un-normalised body. That body
# contains REMOTE_ADDR and REMOTE_HOST (the client address, twice), HTTP_HOST
# and SERVER_PORT (the port, twice) and DOCUMENT_ROOT (three times). Replacing
# them with placeholders hides the values but leaves their exact byte lengths
# restated in the header, so the golden stays machine-specific through the
# header even though the body is clean. Measured against the pinned container:
# the raw body is 882 bytes with Docker Desktop's gateway 192.168.65.1, and
# 878 with Linux Docker's 172.17.0.1 -- both addresses the issue itself names.
# Keeping the wire value would red-line this case permanently on every Linux
# host, i.e. on CI and on wherever frankenrust:bench eventually gets built,
# for every later issue that runs the default gate profile.
#
# So common.py's normalize() restates Content-Length as the length of the
# normalised body. What the rule is protecting is kept: the header is still
# compared, still by name, still in wire order, and a response that omits it
# or moves it still fails. Only the integer is restated, and it is a
# restatement of the body length rather than independent information --
# http.client reads exactly Content-Length bytes and raises IncompleteRead if
# the server sends fewer, so a server that lies about the length shows up as a
# truncated body in the diff either way. common.py's
# check_wire_content_length() asserts that transport guarantee on every
# response instead of assuming it, and lib/selftest.py asserts both that every
# golden's declared length matches the body printed beneath it and that
# normalize() is invariant under the lengths of the values it substitutes --
# those two checks are what fail if this ever regresses.
#
# The same mechanism, unfired today but live later, covers {documentRoot} and
# {phpVersion} in exception/response-headers/server-globals: those lengths are
# fixed for the pinned upstream image and guaranteed to differ for
# frankenrust:bench.

[targets.upstream]
image = "dunglas/frankenphp@sha256:4b0713ddad6ca7eb21eb82ac6bdb7cb41de5192a930b615d89af6e15d74e82f8"
container_port = 80
# Mount point we choose for vendor/frankenphp/testdata inside the container.
# Matches the image's own Caddyfile (`root .`, WORKDIR /app/public) --
# verified empirically: DOCUMENT_ROOT comes back as /app/public when the
# corpus is mounted there.
document_root = "/app/public"
# SERVER_SOFTWARE's value, per the image's frankenphp SAPI. Not exposed via
# any response header, only inside server-all-vars-ordered.php's body, so it
# is recorded here rather than discovered per-request.
server_software = "FrankenPHP"

[defaults]
# Sent with every case unless the case sets headers_override = true.
# No Accept-Encoding is ever sent (skip_accept_encoding, unconditionally, in
# common.py) -- the official image's Caddyfile has `encode zstd br gzip`, and
# a negotiated encoding would change body bytes and Content-Length.
headers = [
    ["User-Agent", "frankenrust-conformance/1"],
    ["Accept", "*/*"],
]

# ---------------------------------------------------------------------------
# Cases
# ---------------------------------------------------------------------------

[[cases]]
name = "hello"
fixture = "hello.php"
method = "GET"
path = "/hello.php"

[[cases]]
name = "index"
fixture = "index.php"
method = "GET"
path = "/index.php"

[[cases]]
name = "echo"
fixture = "echo.php"
method = "POST"
path = "/echo.php"
body = "echo=check"

[[cases]]
name = "input-get"
fixture = "input.php"
method = "GET"
path = "/input.php"

[[cases]]
name = "input-post"
fixture = "input.php"
method = "POST"
path = "/input.php"
body = "input body check"

[[cases]]
name = "read-input"
fixture = "read-input.php"
method = "POST"
path = "/read-input.php"
body = "read-input-conformance"

[[cases]]
name = "cookies-basic"
fixture = "cookies.php"
method = "GET"
path = "/cookies.php"
headers = [
    ["Cookie", "foo=bar"],
    ["Cookie", "i=1"],
]

[[cases]]
name = "cookies-malformed"
fixture = "cookies.php"
method = "GET"
path = "/cookies.php"
headers = [
    ["Cookie", "foo =bar; ===;;==;  .dot.=val  ;  ; PHPSESSID=1234"],
    ["Cookie", "secondCookie=test; secondCookie=overwritten"],
]
notes = """
Adapted from frankenphp_test.go:403-422 (TestMalformedCookie). Upstream's Go
test feeds this header string directly to the handler function in-process
(httptest.NewRecorder), bypassing HTTP/1.1 wire parsing entirely -- that is
the only reason its literal '\\x00' (a real NUL byte, Go `\\x00` in a double-
quoted string) survives as part of a header value there. Measured against the
real container over a real TCP connection: a NUL byte inside a header value
gets a 400 Bad Request from Go's net/http server before the request ever
reaches PHP (net/textproto rejects the control character during header
parsing). Since this harness replays over actual HTTP, the NUL byte is
dropped from this case; the rest of the malformed structure (unequal-sign
noise, leading/trailing spaces, a dot in the cookie name, a second Cookie
header that must not overwrite the first occurrence of a repeated name) is
kept unchanged. Expected body keeps 'foo_' => 'bar', '_dot_' => 'val  ',
'PHPSESSID' => '1234', 'secondCookie' => 'test'.
"""

[[cases]]
name = "headers"
fixture = "headers.php"
method = "GET"
path = "/headers.php"
query = "i=1"

[[cases]]
name = "response-headers"
fixture = "response-headers.php"
method = "GET"
path = "/response-headers.php"
query = "i=0"
notes = """
?i is mandatory, not cosmetic: response-headers.php:10 does
`if ($_GET['i'] % 3) { http_response_code($_GET['i'] + 100); }`. i=0 takes the
falsy branch and keeps status 200; i=1 or i=2 sends 1xx-range codes
(101/102) that were observed to hang a real HTTP/1.1 client mid-response
against this image -- confirmed by hand while building this corpus, not part
of the corpus itself. Pin i=0.
"""

[[cases]]
name = "custom-status-line"
fixture = "custom-status-line.php"
method = "GET"
path = "/custom-status-line.php"

[[cases]]
name = "short-status-line"
fixture = "short-status-line.php"
method = "GET"
path = "/short-status-line.php"

[[cases]]

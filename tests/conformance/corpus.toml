path = "/large-request.php"
query = "i=1"
body_repeat_char = "a"
body_repeat_count = 10000

[[cases]]
name = "flush"
fixture = "flush.php"
method = "GET"
path = "/flush.php"
query = "i=1"
notes = "Body is stable but chunk framing is not (flush() vs a single write). http.client.HTTPResponse.read() decodes Transfer-Encoding: chunked transparently, so comparison here is already on the decoded body, never on chunk boundaries."

[[cases]]
name = "autoloader"
fixture = "autoloader.php"
method = "GET"
path = "/autoloader.php"
query = "i=1"

[[cases]]
name = "file-upload-get"
fixture = "file-upload.php"
method = "GET"
path = "/file-upload.php"

[[cases]]
name = "file-upload-post"
fixture = "file-upload.php"
method = "POST"
path = "/file-upload.php"
kind = "multipart_upload"
multipart_field = "file"
multipart_filename = "conformance.txt"
multipart_content = "frankenrust conformance fixture\n"
multipart_boundary = "----FrankenRustConformanceBoundary1"
notes = "Boundary and filename are fixed, not client-generated, so the exact request bytes are reproducible. The response ('Upload OK') does not echo either back, so this is belt-and-braces rather than load-bearing."

[[cases]]
name = "request-superglobal"
fixture = "request-superglobal.php"
method = "POST"
path = "/request-superglobal.php"
query = "g1=v1"
headers = [["Content-Type", "application/x-www-form-urlencoded"]]
body = "foo=bar&baz=qux"

[[cases]]
name = "transition-regular"
fixture = "transition-regular.php"
method = "GET"
path = "/transition-regular.php"

[[cases]]
name = "finish-request"
fixture = "finish-request.php"
method = "GET"
path = "/finish-request.php"
query = "i=1"

[[cases]]
name = "server-globals"
fixture = "server-globals.php"
method = "GET"
path = "/server-globals.php"

[[cases]]
name = "exception"
fixture = "exception.php"
method = "GET"
path = "/exception.php"
query = "i=0"

[[cases]]
name = "server-all-vars-ordered"
fixture = "server-all-vars-ordered.php"
method = "POST"
path = "/server-all-vars-ordered.php/path"
query = "specialChars=%3E%00</>"
headers = [
    ["Content-Type", "application/x-www-form-urlencoded"],
    ["Special-Chars", "<%00>"],
    ["X-Empty-Header", ""],
]
auth_user = "user"
body = "foo=bar"
min_replays = 10
notes = """
Driven as upstream's own TestAllDefinedServerVars does at
caddy/caddy_test.go:1114 (POST, Content-Type: application/x-www-form-urlencoded,
body foo=bar, PATH_INFO via extra path info, a query string with special
characters, a `user@` credential so REMOTE_USER is populated, plus the
Special-Chars and X-Empty-Header request headers). Upstream's own test relies
on a Caddyfile `rewrite` directive we don't have access to when driving the
plain image; requesting /server-all-vars-ordered.php/path directly produces
the same PATH_INFO split (measured against the running container) via the
image's stock Caddyfile try_files/split_path config, so no rewrite is needed.
`auth_user = "user"` sends `Authorization: Basic <base64("user:")>`. Omitting
PATH_INFO, the query string, or any of the two extra headers bakes
`Undefined array key` warnings into the golden -- measured.
Determinism rests on Go's http.Header map iteration order (cgi.go:151) for
every *other* dropped $_SERVER dump, but this fixture reads only from a fixed
list of hardcoded keys (server-all-vars-ordered.php), so it never touches
that map. min_replays = 10 to prove it (measured 5/5 identical while writing
this corpus; the acceptance bar in issue #4 is >=10).
"""

[[cases]]
name = "request-headers"
fixture = "request-headers.php"
method = "GET"
path = "/request-headers.php"
headers = [["X-Conformance", "1"]]
headers_override = true
min_replays = 10
notes = """
The only coverage of apache_request_headers(). request.Header is a Go map
(cgi.go:151), and Go deliberately randomises map iteration order above one
entry -- measured 4 distinct HTTP_* orderings in 12 runs with a 5-header
request. A *one-element* map has exactly one possible iteration order, so
this case is deterministic by construction as long as it stays at exactly
one custom header -- measured 8/8 identical. headers_override = true is what
makes that true: it suppresses [defaults] (User-Agent, Accept) entirely, and
capture/replay never add Accept-Encoding to any case. Host is promoted to
Go's req.Host and is never part of request.Header, so it does not count
toward the one.

INVARIANT, read before editing: adding a second header to this case turns
the gate into a coin-flip on Go's map iteration order. Do not add one without
re-deriving the determinism measurement in this comment.
"""

